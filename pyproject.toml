[project]
name = "opsweave"
version = "0.1.0"
description = "Agentic RAG system for operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Agent & LLM
    "langgraph>=0.2.60",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.2.14",
    "llama-index-core>=0.12.0",
    "llama-index-llms-langchain>=0.4.0",
    "llama-index-embeddings-langchain>=0.3.0",
    "llama-index-vector-stores-milvus>=0.9.3",
    # Backend API
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.34.0",
    "websockets>=12.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opsweave"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
]
