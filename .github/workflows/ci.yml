name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest # 在 Ubuntu 最新版本上运行。
    steps:
      - uses: actions/checkout@v4 # 使用 actions/checkout 将仓库代码拉取到 Runner 中。
      - uses: astral-sh/setup-uv@v5 # 使用 astral-sh/setup-uv 设置 uv 环境。
      - uses: actions/setup-python@v5 # 使用 actions/setup-python 设置 Python 环境。
        with: # 使用 Python 3.12 版本。
          python-version: "3.12"
      - run: uv sync --dev # 安装开发依赖。
      - run: uv run ruff check src tests # 检查代码格式。
      - run: uv run ruff check src tests --fix # 修复代码格式。
      - run: uv run ruff format --check src tests # 检查代码格式是否符合要求。
      - run: uv run pytest tests/ # 运行测试。

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
